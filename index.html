<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook — AI Study Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --paper: #F6F1E4;
    --paper-line: #DED4B8;
    --ink: #23301F;
    --ink-soft: #5B6653;
    --spine: #8A5A32;
    --accent: #B8722E;
    --accent-soft: #E7C9A0;
    --ok: #4C7A5E;
    --danger: #A94438;
    --bubble-user: #E7C9A0;
    --bubble-ai: #FFFDF8;
    --sidebar: #2E241A;
    --sidebar-text: #E9DCC4;
    --sidebar-hover: #3C3024;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    display:flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ---- Sidebar ---- */
  #sidebar{
    width: 268px;
    flex-shrink: 0;
    background: var(--sidebar);
    color: var(--sidebar-text);
    display:flex;
    flex-direction: column;
    transition: margin-left 0.2s ease;
  }
  #sidebar.collapsed{ margin-left: -268px; }
  .sidebar-top{
    padding: 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .sidebar-top-row{
    display:flex;
    align-items:center;
    gap: 0.5rem;
  }
  .new-chat-btn{
    flex: 1;
    width:100%;
    display:flex; align-items:center; gap:0.5rem;
    background: transparent;
    border: 1.5px solid rgba(233,220,196,0.3);
    color: var(--sidebar-text);
    font-family:'JetBrains Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.7rem 0.9rem;
    border-radius: var(--radius);
    cursor: pointer;
  }
  .new-chat-btn:hover{ background: var(--sidebar-hover); }
  #closeSidebarBtn{
    display: none;
    flex-shrink: 0;
    background: transparent;
    border: 1.5px solid rgba(233,220,196,0.3);
    color: var(--sidebar-text);
    width: 38px; height: 38px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 1rem;
  }
  #sidebarBackdrop{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 15;
  }
  .chat-list{
    flex:1;
    overflow-y: auto;
    padding: 0.6rem;
  }
  .chat-item{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 0.4rem;
    padding: 0.65rem 0.7rem;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 0.86rem;
    color: var(--sidebar-text);
    margin-bottom: 0.2rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-item:hover{ background: var(--sidebar-hover); }
  .chat-item.active{ background: var(--accent); color: #201408; }
  .chat-item .del{
    opacity: 0;
    background: none; border: none; color: inherit; cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    padding: 0 0.2rem;
    flex-shrink:0;
  }
  .chat-item:hover .del{ opacity: 0.7; }
  .chat-item .del:hover{ opacity: 1; }
  .sidebar-bottom{
    padding: 0.9rem 1rem 1.1rem;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-family:'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: rgba(233,220,196,0.6);
  }
  .sidebar-bottom button{
    background: none; border: none; color: inherit;
    text-decoration: underline; cursor: pointer;
    font-family: inherit; font-size: inherit; padding: 0;
  }

  /* ---- Main chat area ---- */
  #main{
    flex: 1;
    display:flex;
    flex-direction: column;
    min-width: 0;
    background: var(--paper);
    background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 2.4rem;
  }
  #topbar{
    display:flex;
    align-items:center;
    gap: 0.8rem;
    padding: 0.9rem 1.2rem;
    border-bottom: 1px solid var(--paper-line);
    background: rgba(246,241,228,0.92);
    backdrop-filter: blur(4px);
  }
  #menuBtn{
    background:none; border: 1.5px solid var(--ink); border-radius: var(--radius);
    width: 36px; height: 36px; cursor:pointer; color: var(--ink);
    font-family: monospace; font-size: 1rem;
    flex-shrink:0;
  }
  .topbar-title{
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 1.15rem;
  }
  .topbar-title span{ color: var(--accent); }
  .quota-pill{
    margin-left: auto;
    font-family:'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    border: 1px solid var(--paper-line);
    padding: 0.3rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  #messages{
    flex: 1;
    overflow-y: auto;
    padding: 1.6rem 1.2rem 1rem;
  }
  .msg-row{
    display:flex;
    margin-bottom: 1.1rem;
  }
  .msg-row.user{ justify-content: flex-end; }
  .bubble{
    max-width: min(640px, 82%);
    padding: 0.85rem 1.05rem;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 0.96rem;
    white-space: pre-wrap;
  }
  .msg-row.user .bubble{
    background: var(--bubble-user);
    color: var(--ink);
    border-bottom-right-radius: 4px;
  }
  .msg-row.ai .bubble{
    background: var(--bubble-ai);
    border: 1px solid var(--paper-line);
    border-bottom-left-radius: 4px;
  }
  .bubble .ai-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    display:block;
    margin-bottom: 0.35rem;
  }
  .bubble-actions{
    margin-top: 0.6rem;
    display:flex; gap: 0.5rem;
  }
  .bubble-actions button{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 0.35rem 0.6rem;
    cursor: pointer;
  }
  .bubble-actions button:hover{ background: var(--ink); color: var(--paper); }

  .sheet-doc{
    background: #FFFDF8;
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 1.6rem 1.3rem;
  }
  .sheet-title{
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 1.5rem;
    line-height: 1.25;
    margin: 0 0 1.3rem;
    padding-bottom: 0.9rem;
    border-bottom: 3px solid var(--ink);
    color: var(--ink);
  }
  .sheet-entry{
    display:flex;
    gap: 0.9rem;
    padding: 0 0 1.3rem;
    margin-bottom: 1.3rem;
    align-items: flex-start;
    border-bottom: 1px solid var(--paper-line);
  }
  .sheet-entry:last-child{ margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .sheet-num{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 1rem;
    color: #fff;
    background: var(--accent);
    min-width: 2.1rem;
    height: 2.1rem;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    margin-top: 0.1rem;
  }
  .sheet-entry-body{ flex:1; min-width: 0; }
  .sheet-heading{
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 1.12rem;
    line-height: 1.35;
    margin: 0 0 0.45rem;
    color: var(--ink);
  }
  .sheet-explain{
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.74rem;
    font-style: normal;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    margin: 0 0 0.6rem;
    line-height: 1.5;
  }
  .sheet-content{
    font-size: 0.96rem;
    line-height: 1.75;
    white-space: pre-wrap;
    margin: 0;
    color: var(--ink);
  }
  #pdfStage{
    position: fixed;
    left: -9999px;
    top: 0;
    width: 700px;
  }
  #pdfStage .sheet-doc{ border: none; padding: 0.4in; }
  #pdfStage .sheet-entry{ break-inside: avoid; }

  .typing{
    display:flex; gap:0.3rem; align-items:center; padding: 0.4rem 0;
  }
  .typing span{
    width: 6px; height:6px; border-radius:50%;
    background: var(--accent);
    animation: bounce 1.1s infinite;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform: translateY(0); opacity:0.5; } 30%{ transform: translateY(-4px); opacity:1; } }

  .empty-state{
    height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    color: var(--ink-soft);
    padding: 2rem;
  }
  .empty-state h2{
    font-family:'Source Serif 4', serif;
    color: var(--ink);
    font-size: 1.6rem;
    margin: 0 0 0.5rem;
  }
  .empty-state p{ max-width: 42ch; font-size: 0.92rem; line-height:1.6; }
  .chips{
    display:flex; gap:0.5rem; flex-wrap:wrap; justify-content:center; margin-top:1.2rem;
  }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.76rem;
    border: 1px solid var(--paper-line);
    background: #fff;
    padding: 0.5rem 0.8rem;
    border-radius: 999px;
    cursor: pointer;
    color: var(--ink);
  }
  .chip:hover{ border-color: var(--accent); color: var(--accent); }

  #inputBar{
    padding: 0.9rem 1.2rem 1.2rem;
    border-top: 1px solid var(--paper-line);
    background: rgba(246,241,228,0.92);
  }
  .composer{
    display:flex;
    align-items: flex-end;
    gap: 0.6rem;
    background: #FFFDF8;
    border: 1.5px solid var(--ink);
    border-radius: 14px;
    padding: 0.5rem 0.5rem 0.5rem 1rem;
  }
  #promptInput{
    flex:1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 0.96rem;
    max-height: 160px;
    padding: 0.5rem 0;
    color: var(--ink);
  }
  #sendBtn{
    background: var(--ink);
    color: var(--paper);
    border: none;
    width: 38px; height: 38px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.1rem;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #sendBtn:disabled{ opacity: 0.4; cursor: not-allowed; }
  .composer-hint{
    text-align:center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--ink-soft);
    margin-top: 0.5rem;
  }

  @media (max-width: 720px){
    #sidebar{ position: fixed; z-index: 20; height:100%; }
    #sidebar:not(.collapsed){ margin-left:0; box-shadow: 8px 0 24px rgba(0,0,0,0.25); }
    #sidebar.collapsed{ margin-left: -268px; }
    #closeSidebarBtn{ display: block; }
    #sidebar:not(.collapsed) ~ #sidebarBackdrop{ display: block; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-top-row">
      <button class="new-chat-btn" id="newChatBtn">+ New chat</button>
      <button id="closeSidebarBtn" aria-label="Close menu">✕</button>
    </div>
  </div>
  <div class="chat-list" id="chatList"></div>
  <div class="sidebar-bottom">
    Notebook v2 · chats saved on this device only ·
    <button id="clearAllBtn">clear all</button>
  </div>
</aside>

<div id="sidebarBackdrop"></div>

<div id="main">
  <div id="topbar">
    <button id="menuBtn">☰</button>
    <div class="topbar-title">Note<span>book</span></div>
    <div class="quota-pill" id="quotaPill"></div>
  </div>

  <div id="messages"></div>

  <div id="inputBar">
    <div class="composer">
      <textarea id="promptInput" rows="1" placeholder="Ask for notes, a specimen paper, or anything to explain..."></textarea>
      <button id="sendBtn">↑</button>
    </div>
    <p class="composer-hint" id="composerHint"></p>
  </div>
</div>

<script>
const MODEL = "nvidia/nemotron-3-ultra-550b-a55b:free";
const DAILY_LIMIT = 3;
const todayKey = () => "nb_count_" + new Date().toISOString().slice(0,10);

/* ---------- storage helpers ---------- */
function getCount(){ return parseInt(localStorage.getItem(todayKey()) || "0", 10); }
function incCount(){ localStorage.setItem(todayKey(), String(getCount()+1)); renderQuota(); }

function loadChats(){
  try{ return JSON.parse(localStorage.getItem("nb_chats") || "[]"); }
  catch(e){ return []; }
}
function saveChats(chats){ localStorage.setItem("nb_chats", JSON.stringify(chats)); }

let chats = loadChats();
let activeId = null;

function newChat(){
  const chat = { id: Date.now().toString(36), title: "New chat", messages: [] };
  chats.unshift(chat);
  saveChats(chats);
  activeId = chat.id;
  renderChatList();
  renderMessages();
}

function getActiveChat(){ return chats.find(c => c.id === activeId); }

function renderChatList(){
  const list = document.getElementById("chatList");
  list.innerHTML = "";
  chats.forEach(c => {
    const item = document.createElement("div");
    item.className = "chat-item" + (c.id === activeId ? " active" : "");
    item.innerHTML = `<span>${escapeHTML(c.title)}</span><button class="del" title="Delete">✕</button>`;
    item.addEventListener("click", (e) => {
      if(e.target.classList.contains("del")){
        chats = chats.filter(x => x.id !== c.id);
        saveChats(chats);
        if(activeId === c.id){ activeId = chats[0] ? chats[0].id : null; }
        renderChatList();
        renderMessages();
        return;
      }
      activeId = c.id;
      renderChatList();
      renderMessages();
      if(window.innerWidth <= 720) document.getElementById("sidebar").classList.add("collapsed");
    });
    list.appendChild(item);
  });
}

function extractJSON(text){
  let cleaned = text.trim().replace(/^```json/i, "").replace(/^```/,"").replace(/```$/,"").trim();
  const start = cleaned.indexOf("{");
  const end = cleaned.lastIndexOf("}");
  if(start === -1 || end === -1) throw new Error("Could not find JSON in response.");
  cleaned = cleaned.slice(start, end+1);
  return JSON.parse(cleaned);
}

function validateSheet(sheet){
  if(!sheet || !Array.isArray(sheet.entries) || sheet.entries.length === 0){
    return "Response had no entries.";
  }
  for(let i=0;i<sheet.entries.length;i++){
    const e = sheet.entries[i];
    if(e.number !== i+1) return `Numbering broke at entry ${i+1} (got ${e.number}).`;
    if(!e.heading || !e.content) return `Entry ${i+1} is missing content.`;
  }
  return null;
}

/* Builds the same styled markup for both the on-screen bubble and the PDF,
   so what the student sees is exactly what gets downloaded. */
function buildSheetHTML(sheet){
  const entriesHTML = sheet.entries.map(e => `
    <div class="sheet-entry">
      <div class="sheet-num">${e.number}</div>
      <div class="sheet-entry-body">
        <p class="sheet-heading">${escapeHTML(e.heading)}</p>
        ${e.explanation ? `<p class="sheet-explain">${escapeHTML(e.explanation)}</p>` : ""}
        <p class="sheet-content">${formatContent(e.content)}</p>
      </div>
    </div>`).join("");
  return `
    <div class="sheet-doc">
      <h2 class="sheet-title">${escapeHTML(sheet.title)}</h2>
      ${entriesHTML}
    </div>`;
}

/* Escapes the raw text first (safety), then turns light markdown into real
   HTML: **bold** becomes <strong>, and lines that look like a question/part
   label (e.g. "Q1.", "(a)", "OR") get bolded automatically so they stand
   out from the surrounding answer text — this is what makes a paper read
   like a real one instead of one flat block of text. */
function formatContent(str){
  let safe = escapeHTML(str);
  safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  safe = safe.replace(/^(Q\d+\.|Answer:|Solution:|Note:|OR)(\s)/gm, "<strong>$1</strong>$2");
  return safe;
}

function escapeHTML(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function renderQuota(){
  const used = getCount();
  document.getElementById("quotaPill").textContent = `${DAILY_LIMIT - used}/${DAILY_LIMIT} left today`;
  document.getElementById("composerHint").textContent =
    used >= DAILY_LIMIT ? "Daily limit reached — resets at midnight." : "3 generations/day, free.";
}

function renderMessages(){
  const wrap = document.getElementById("messages");
  const chat = getActiveChat();
  if(!chat || chat.messages.length === 0){
    wrap.innerHTML = `
      <div class="empty-state">
        <h2>What are we studying today?</h2>
        <p>Ask for notes on a topic, request a specimen paper, or just ask a question. Answers come numbered and explained, ready to save as a PDF.</p>
        <div class="chips">
          <button class="chip" data-fill="Make notes on Photosynthesis for Class 10 Science">Notes on Photosynthesis</button>
          <button class="chip" data-fill="Give me a specimen paper for Class 10 Maths, Chapter: Trigonometry">Trigonometry specimen paper</button>
          <button class="chip" data-fill="Explain Newton's laws of motion simply">Explain Newton's laws</button>
        </div>
      </div>`;
    wrap.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.getElementById("promptInput").value = chip.dataset.fill;
        document.getElementById("promptInput").focus();
      });
    });
    return;
  }
  wrap.innerHTML = "";
  chat.messages.forEach((m, idx) => {
    const row = document.createElement("div");
    row.className = "msg-row " + (m.role === "user" ? "user" : "ai");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if(m.role === "assistant"){
      const label = document.createElement("span");
      label.className = "ai-label";
      label.textContent = "Notebook";
      bubble.appendChild(label);

      const body = document.createElement("div");
      if(m.sheet){
        body.innerHTML = buildSheetHTML(m.sheet);
      } else {
        body.textContent = m.content;
      }
      bubble.appendChild(body);

      const actions = document.createElement("div");
      actions.className = "bubble-actions";
      const dl = document.createElement("button");
      dl.textContent = "Download as PDF";
      dl.addEventListener("click", () => downloadPDF(m.sheet || { title: chat.title, entries: [{number:1, heading:"Response", explanation:"", content:m.content}] }));
      actions.appendChild(dl);
      bubble.appendChild(actions);
    } else {
      bubble.textContent = m.content;
    }
    row.appendChild(bubble);
    wrap.appendChild(row);
  });
  wrap.scrollTop = wrap.scrollHeight;
}

function showTyping(){
  const wrap = document.getElementById("messages");
  const row = document.createElement("div");
  row.className = "msg-row ai";
  row.id = "typingRow";
  row.innerHTML = `<div class="bubble"><span class="ai-label">Notebook</span><div class="typing"><span></span><span></span><span></span></div></div>`;
  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
}
function hideTyping(){
  const el = document.getElementById("typingRow");
  if(el) el.remove();
}

/* ---------- API call ----------
   This calls OUR OWN backend (backend/api/generate.js), which holds the
   OpenRouter key safely as a server-side environment variable. The key
   never appears anywhere in this file or in the browser. */
async function callNemotron(messages){
  const res = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages })
  });

  let data;
  try{
    data = await res.json();
  } catch(parseErr){
    // Server returned something that wasn't JSON at all — usually means
    // the request took too long and the platform killed it, or a gateway
    // error page came back instead of our own response.
    throw new Error("The server took too long to respond. Try a shorter request, or try again in a moment.");
  }

  if(!res.ok){
    throw new Error(data.error || `Server error (${res.status})`);
  }
  if(!data.content) throw new Error("Empty response from model.");
  return data.content;
}

async function sendMessage(){
  if(getCount() >= DAILY_LIMIT) return;

  const input = document.getElementById("promptInput");
  const text = input.value.trim();
  if(!text) return;

  if(!getActiveChat()) newChat();
  const chat = getActiveChat();
  if(chat.messages.length === 0){
    chat.title = text.slice(0, 42) + (text.length > 42 ? "…" : "");
  }
  chat.messages.push({ role: "user", content: text });
  saveChats(chats);
  input.value = "";
  autoGrow(input);
  renderChatList();
  renderMessages();

  document.getElementById("sendBtn").disabled = true;
  showTyping();

  try{
    const history = chat.messages
      .filter(m => m.role === "user" || m.role === "assistant")
      .map(m => ({ role: m.role, content: m.sheet ? JSON.stringify(m.sheet) : m.content }));
    const raw = await callNemotron(history);

    let sheet = null;
    let plainFallback = raw;
    try{
      const parsed = extractJSON(raw);
      const problem = validateSheet(parsed);
      if(!problem){
        sheet = parsed;
      } else {
        // one retry: ask the model to fix its own output
        const fixHistory = [...history, { role: "assistant", content: raw }, {
          role: "user",
          content: `Your previous JSON had a problem: ${problem}\nReturn ONLY corrected valid JSON in the same schema, fully fixed.`
        }];
        const raw2 = await callNemotron(fixHistory);
        const parsed2 = extractJSON(raw2);
        const problem2 = validateSheet(parsed2);
        if(!problem2){ sheet = parsed2; } else { plainFallback = raw2; }
      }
    } catch(parseErr){
      // model didn't return valid JSON at all — fall back to showing raw text
    }

    chat.messages.push(sheet
      ? { role: "assistant", sheet, content: plainFallback }
      : { role: "assistant", content: plainFallback });
    saveChats(chats);
    incCount();
  } catch(err){
    const msg = err.message && err.message.includes("Daily limit")
      ? "⚠ " + err.message
      : "⚠ " + (err.message || "Something went wrong. Please try again.");
    chat.messages.push({ role: "assistant", content: msg });
    saveChats(chats);
  } finally {
    hideTyping();
    renderMessages();
    document.getElementById("sendBtn").disabled = getCount() >= DAILY_LIMIT;
  }
}

/* ---------- PDF export ----------
   Renders the SAME styled HTML used in the chat bubble into a hidden
   offscreen container, then hands that container to html2pdf.js, which
   converts it straight into a polished PDF — no manual line-by-line
   text plotting, no lost formatting. */
function downloadPDF(sheet){
  let stage = document.getElementById("pdfStage");
  if(!stage){
    stage = document.createElement("div");
    stage.id = "pdfStage";
    document.body.appendChild(stage);
  }
  stage.innerHTML = buildSheetHTML(sheet);

  const safeName = (sheet.title || "notes").toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40) || "notes";

  html2pdf().set({
    margin: 0,
    filename: `${safeName}.pdf`,
    image: { type: "jpeg", quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: "in", format: "a4", orientation: "portrait" },
    pagebreak: { mode: ["avoid-all", "css", "legacy"] }
  }).from(stage).save();
}

/* ---------- misc UI ---------- */
function autoGrow(el){
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}

document.addEventListener("DOMContentLoaded", () => {
  if(chats.length > 0) activeId = chats[0].id;
  renderChatList();
  renderMessages();
  renderQuota();
});

document.getElementById("newChatBtn").addEventListener("click", () => {
  newChat();
  if(window.innerWidth <= 720) document.getElementById("sidebar").classList.add("collapsed");
});
document.getElementById("menuBtn").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("collapsed");
});
document.addEventListener("click", (e) => {
  if(e.target.closest("#closeSidebarBtn") || e.target.closest("#sidebarBackdrop")){
    document.getElementById("sidebar").classList.add("collapsed");
  }
});
document.getElementById("clearAllBtn").addEventListener("click", () => {
  if(confirm("Delete all saved chats on this device?")){
    chats = [];
    saveChats(chats);
    activeId = null;
    renderChatList();
    renderMessages();
  }
});
document.getElementById("sendBtn").addEventListener("click", sendMessage);
const promptInput = document.getElementById("promptInput");
promptInput.addEventListener("input", () => autoGrow(promptInput));
promptInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

if(window.innerWidth <= 720) document.getElementById("sidebar").classList.add("collapsed");
</script>
